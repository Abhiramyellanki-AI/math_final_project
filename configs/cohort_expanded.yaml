project:
  name: "eeg-p3-motor-imagery-expanded-cohort"
  version: "0.2.0"
  random_seed: 42
  experiment_mode: "multi_subject_option_a"

data:
  dataset_name: "PhysioNet EEG Motor Movement/Imagery Dataset (eegmmidb v1.0.0)"
  local_data_dir: "C:/Users/Abhiram/Downloads/eegmmidb-1.0.0/files"
  allow_download_fallback: false
  candidate_subject_range: [2, 109]
  excluded_subject_ids: [1]  # Subject 1 excluded by default (Run 12 already inspected in pilot)
  development_runs: [4, 8]
  held_out_test_run: 12
  expected_channels: 64
  expected_sfreq: 160.0
  signal_unit: "V"
  min_trials_per_run: 1
  require_both_classes_per_run: true
  label_mapping:
    T1: 0  # Imagined left fist movement
    T2: 1  # Imagined right fist movement
  excluded_annotations: ["T0"]  # Rest period excluded

preprocessing:
  bandpass_low_hz: 8.0
  bandpass_high_hz: 30.0
  filter_method: "fir"
  filter_design: "firwin"
  zero_phase_offline: true
  epoch_tmin_sec: 0.5
  epoch_tmax_sec: 2.5
  expected_n_times: 320  # (2.5 - 0.5) * 160.0 Hz = 320 samples

features:
  mu_band_hz: [8.0, 13.0]
  beta_band_hz: [13.0, 30.0]
  log_epsilon: 1.0e-12

baselines:
  linear_svc_c_grid: [0.1, 1.0, 10.0]
  rbf_svc_c_grid: [0.1, 1.0, 10.0]
  rbf_svc_gamma_grid: ["scale", 0.01, 0.1]
  max_iter: 5000

hosvd:
  channel_ranks: [4, 8, 16]
  time_ranks: [10, 20, 40]
  linear_svc_c_grid: [0.1, 1.0, 10.0]

rks:
  n_components_grid: [128, 256, 512]
  gamma_grid: [0.001, 0.01, 0.1]
  linear_svc_c_grid: [0.1, 1.0, 10.0]
  random_seeds: [42, 1337, 2026]

markov:
  option: "A"
  n_states_grid: [3, 4, 6]
  subwindow_samples: 40
  subwindow_stride: 20
  laplace_alpha: 0.5
  linear_svc_c_grid: [0.1, 1.0, 10.0]

outputs:
  output_dir: "outputs/cohort_expanded"
  figures_dir: "outputs/cohort_expanded/figures"
  metrics_dir: "outputs/cohort_expanded/metrics"
