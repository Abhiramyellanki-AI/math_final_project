[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-endsem-svd"
version = "0.1.0"
description = "Recording-separated personalized EEG classification with SVD and RBF SVM"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "mne>=1.8", "pandas>=2.1", "matplotlib>=3.8", "PyYAML>=6", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
slides = ["python-pptx>=1.0"]

[project.scripts]
eeg-svd = "eeg_svd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
